<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ page_title }}</title>


        <!-- links -->
        <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', path='css/all.min.css') }}">
    </head>

    <body>

        <!-- start form -->
        <div class="start-form">
            <h2 class="welcome">Welcome</h2>
           <div class="buttons">
                <button type="button" class="visitor">Visitor</button>
                <button type="button" class="subscriber">Subscriber</button>
           </div>
        </div>

        <div class="register-form">
            <form action="">
                <input type="text" name="user_name" id="userName" placeholder="Please, enter your name" required>
                <input type="email" name="user_email" id="userEmail" placeholder="Please, enter your email" required>
                <input type="password" name="user_password" id="userPassword" placeholder="Please, enter your password" required>
                <input type="password" name="confirm_password" id="confirmPassword" placeholder="Please, confirm your password" required>
                <p class="form-message" aria-live="polite"></p>

                <input type="submit" value="Register" id="submitBtn">
            </form>

            <button type="button" class="close-form" title="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <button type="button" class="have-email">Already have an email?</button>
        </div>


        <div class="login-form">
            <form action="">
                <input type="email" name="user_email" id="userEmail" placeholder="Please, enter your email" required>
                <input type="password" name="user_password" id="userPassword" placeholder="Please, enter your password" required>
                <p class="form-message" aria-live="polite"></p>

                <input type="submit" value="Login" id="submitBtn">
            </form>
            <button type="button" class="close-form" title="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <button type="button" class="have-no-email">New?</button>
        </div>


        <!-- alerts -->
        <div class="alerts" aria-live="polite">

        </div>

        <main class="app-shell">

            <!-- ----------------- Top bar ------------------- -->
            <header class="topbar">
                <div>
                    <h1 class="topbar-title">{{ app_name }}</h1>
                </div>
                <div class="user-profile">
                    <div class="buttons">
                        <button type="button" class="login" id="login">Log In</button>
                        <button type="button" class="logout" id="logout" hidden>Log Out</button>
                    </div>
                    <div class="logo">V</div>
                </div>
            </header>

            <p class="welcome-message" aria-live="polite"></p>

            
            <section class="chat-panel">
                <!-- ----------------- Chat header ------------------- -->
                <div class="chat-header">
                    <div>
                        <p>Select a PDF to make the bot answer based on its contents.</p>
                    </div>
                    <div class="control-area">
                        <div class="list-files">
                            <button type="button" class="list-files-btn" title="List uploaded Files">
                                <i class="fa-solid fa-caret-down"></i>
                            </button>
                            <form class="files">
                            </form>
                        </div>
                    </div>
                </div>

                <!-- ----------------- Chat  ------------------- -->
                <div class="messages" id="messages">

                    <article class="message assistant-message">
                        
                        <div class="avatar">AI</div>

                        <div class="message-content">
                            <p>Ask a question to begin.</p>
                        </div>

                    </article>

                    <!-- Example user message -->
                    <!-- <article class="message user-message">
                        
                        <div class="message-content">
                            <p>Summarize the uploaded document.</p>
                        </div>

                        <div class="avatar">{{ user_name[0] }}</div>


                    </article> -->
                   
                </div>

                <form class="query-form" id="queryForm">

                    <textarea
                        class="query-area"
                        id="queryArea"
                        name="query"
                        rows="1"
                        placeholder="Ask a question..."
                        required
                    ></textarea>

                    <div class="buttons">

                        <div>
                            <button type="button" title="Upload PDF" class="upload-pdf">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                            <input type="file" id="fileInput" hidden>
                        </div>


                        <button class="send" title="Send">
                            <i class="fa-solid fa-arrow-up-long"></i>
                        </button>

                    </div>
                </form>

            </section>
        </main>


        <script type="module" src="{{ url_for('static', path = 'js/auth.js') }}"></script>
        <script type="module" src="{{ url_for('static', path = 'js/data.js') }}"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    </body>
</html>
