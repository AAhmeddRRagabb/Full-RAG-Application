<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ page_title }}</title>

        <!-- css links -->
        <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', path='css/all.min.css') }}">
    </head>

    <body>

        <!-- app layout -->
        <div class="page">

            <!-- app rail -->
            <aside class="app-rail" aria-label="Application controls">
                <button type="button" class="rail-button user-profile-toggle" data-tooltip="Open account panel" aria-label="Open profile" aria-expanded="false">
                    <i class="fa-solid fa-user"></i>
                </button>

                <button type="button" class="rail-button chats-toggle" data-tooltip="Open chat library" aria-label="Open chats" aria-expanded="false">
                    <i class="fa-solid fa-comment"></i>
                </button>
            </aside>

            <!-- main area -->
            <main class="main-area">

                <!-- main header -->
                <header class="header">
                    <div class="container">
                        <h1 class="header-title">New Chat</h1>

                        <button type="button" class="header-icon-button chat-settings-toggle" data-tooltip="Open chat settings" aria-label="Open chat settings" aria-expanded="false">
                            <i class="fa-solid fa-sliders"></i>
                        </button>
                    </div>
                </header>

                <!-- chat area -->
                <section class="chat-area">
                    <div class="container">
                        <div class="messages" id="messages" aria-live="polite"></div>

                        <!-- query form -->
                        <form class="query-form" id="queryForm">
                            <p class="run-status" aria-live="polite"></p>

                            <textarea
                                id="queryArea"
                                name="query"
                                rows="1"
                                placeholder="Ask a question..."
                                required
                            ></textarea>

                            <button type="button" class="query-cancel-btn" aria-label="Stop waiting for response" hidden>
                                <i class="fa-solid fa-stop"></i>
                            </button>

                            <button type="submit" class="query-form_submit-btn" aria-label="Send message">
                                <i class="fa-solid fa-arrow-up-long"></i>
                            </button>
                        </form>
                    </div>
                </section>

            </main>

        </div>

        <!-- user profile modal -->
        <section class="user-profile-modal app-modal" aria-label="User profile">
            <div class="modal-header">
                <div>
                    <p class="modal-eyebrow">Profile</p>
                    <h2>Account</h2>
                </div>

                <button type="button" class="modal-close" aria-label="Close profile">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <p class="welcome-message" aria-live="polite">Welcome User</p>

            <div class="profile-actions">
                <button type="button" class="login" id="login">Log In</button>
                <button type="button" class="logout" id="logout" hidden>Log Out</button>
            </div>
        </section>

        <!-- register modal -->
        <div class="register-form">
            <form action="">
                <label for="registerUserName">
                    User Name
                    <input type="text" name="user_name" id="registerUserName" required>
                </label>

                <label for="registerUserEmail">
                    Email
                    <input type="email" name="user_email" id="registerUserEmail" required>
                </label>

                <label for="registerUserPassword">
                    Password
                    <input type="password" name="user_password" id="registerUserPassword" required>
                </label>

                <label for="confirmPassword">
                    Confirm Password
                    <input type="password" name="confirm_password" id="confirmPassword" required>
                </label>

                <p class="form-message" aria-live="polite"></p>
                <input type="submit" value="Register" id="registerSubmitBtn">
            </form>

            <button type="button" class="close-form" aria-label="Close register form">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <button type="button" class="have-email">Login</button>
        </div>

        <!-- login modal -->
        <div class="login-form">
            <form action="">
                <label for="loginUserEmail">
                    Email
                    <input type="email" name="user_email" id="loginUserEmail" required>
                </label>

                <label for="loginUserPassword">
                    Password
                    <input type="password" name="user_password" id="loginUserPassword" required>
                </label>

                <p class="form-message" aria-live="polite"></p>
                <input type="submit" value="Login" id="loginSubmitBtn">
            </form>

            <button type="button" class="close-form" aria-label="Close login form">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <button type="button" class="have-no-email">Create account</button>
        </div>


        <!-- chats modal -->
        <section class="chats-modal app-modal" aria-label="Your chats">

            <!-- chats modal header -->
            <div class="modal-header">
                <div>
                    <p class="modal-eyebrow">Workspace</p>
                    <h2>Chats</h2>
                </div>

                <button type="button" class="modal-close" aria-label="Close chats">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- chats list -->
            <div class="chats-list" aria-label="Saved chats"></div>

            <!-- add chat action -->
            <button type="button" class="add-new-chat-btn">
                <i class="fa-solid fa-plus"></i>
                <span>New chat</span>
            </button>
        </section>

        <!-- chat settings modal -->
        <section class="chat-settings-modal app-modal" aria-label="Chat settings">

            <!-- settings modal header -->
            <div class="modal-header">
                <div>
                    <p class="modal-eyebrow">Current chat</p>
                    <h2>Settings</h2>
                </div>

                <button type="button" class="modal-close" aria-label="Close settings">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- resources settings -->
            <div class="chat-resources">
                <div class="settings-section_header">
                    <h3>Resources</h3>
                    <p class="resources-status" aria-live="polite">Nothing selected.</p>
                </div>

                <div class="settings-card files-control">
                    <div>
                        <h4>Files</h4>
                        <p>Selected files are used by default.</p>
                    </div>

                    <button type="button" class="icon-button add-new-file-btn" aria-label="Upload PDF">
                        <i class="fa-solid fa-plus"></i>
                    </button>

                    <input type="file" id="fileInput" accept=".pdf" hidden>
                    <form class="file-list" aria-label="Uploaded files"></form>
                </div>

                <!-- tone settings -->
                <div class="settings-card option-control">
                    <div>
                        <h4>Tone</h4>
                        <p>Choose how the answer should sound.</p>
                    </div>

                    <div class="settings-options" role="radiogroup" aria-label="Chat tone">
                        <label>
                            <input type="radio" name="chatTone" value="technical" checked>
                            <span>Technical</span>
                        </label>

                        <label>
                            <input type="radio" name="chatTone" value="creative">
                            <span>Creative</span>
                        </label>
                    </div>
                </div>

                <!-- depth settings -->
                <div class="settings-card option-control">
                    <div>
                        <h4>Depth</h4>
                        <p>Set how much detail to include.</p>
                    </div>

                    <div class="settings-options three-options" role="radiogroup" aria-label="Answer depth">
                        <label>
                            <input type="radio" name="answerDepth" value="low">
                            <span>Low</span>
                        </label>

                        <label>
                            <input type="radio" name="answerDepth" value="moderate" checked>
                            <span>Moderate</span>
                        </label>

                        <label>
                            <input type="radio" name="answerDepth" value="high">
                            <span>High</span>
                        </label>
                    </div>
                </div>

            </div>

        </section>

        <!-- alerts -->
        <div class="alerts" aria-live="polite"></div>

        <!-- scripts -->
        <script type="module" src="{{ url_for('static', path = 'js/auth.js') }}"></script>
        <script type="module" src="{{ url_for('static', path = 'js/data.js') }}"></script>
        <script type="module" src="{{ url_for('static', path = 'js/chat.js') }}"></script>
        <script type="module" src="{{ url_for('static', path = 'js/ui.js') }}"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    </body>
</html>
